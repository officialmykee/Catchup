<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #fff;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      min-height: 100vh;
      padding-top: 40px;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      padding: 20px 16px 36px;
      width: 100%;
      max-width: 420px;
    }

    .field {
      margin-bottom: 12px;
    }

    .label-wrap {
      position: relative;
    }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
      border: 1.5px solid #dde1f0;
      border-radius: 12px;
      padding: 0 14px;
      background: #fff;
      transition: border-color 0.2s;
    }

    .input-wrap:focus-within {
      border-color: #406580;
    }

    .input-wrap.has-error {
      border-color: #b5534d;
    }

    .input-wrap svg {
      flex-shrink: 0;
      color: #b0b8d0;
      margin-right: 10px;
    }

    .input-wrap input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 15px;
      color: #333;
      padding: 12px 0;
      background: transparent;
    }

    /* The floating label — holds both the title and the error inline */
    .field label {
      position: absolute;
      left: 44px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 15px;
      color: #b0b8d0;
      pointer-events: none;
      transition: top 0.2s ease, font-size 0.2s ease, color 0.2s ease, transform 0.2s ease;
      background: #fff;
      padding: 0 4px;
      display: flex;
      align-items: baseline;
      gap: 5px;
      white-space: nowrap;
    }

    .field label.floated {
      top: 0;
      font-size: 12px;
      color: #406580;
      transform: translateY(-50%);
    }

    .input-wrap:focus-within + label,
    .input-wrap input:not(:placeholder-shown) ~ label {
      top: 0;
      transform: translateY(-50%);
      font-size: 12px;
      color: #406580;
    }

    .input-wrap:focus-within ~ label {
      top: 0;
      transform: translateY(-50%);
      font-size: 12px;
      color: #406580;
    }

    /* The error chip that appears next to the label text */
    .label-error {
      font-size: 11px;
      color: #b5534d;
      font-weight: 600;
      opacity: 0;
      transform: translateX(-4px);
      transition: opacity 0.2s ease, transform 0.2s ease;
      pointer-events: none;
    }

    .label-error.visible {
      opacity: 1;
      transform: translateX(0);
    }

    .label-title {
      transition: opacity 0.15s ease;
    }

    .label-title.hidden-title {
      display: none;
    }

    .btn-login {
      display: block;
      width: 100%;
      height: 44px;
      padding: 0;
      border: none;
      border-radius: 14px;
      background: #406580;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.3px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      margin-top: 8px;
    }

    .btn-login:hover {
      opacity: 0.93;
    }

    .btn-login:active {
      transform: scale(0.98);
    }

    .divider {
      display: flex;
      align-items: center;
      margin: 16px 0;
      color: #aaa;
      font-size: 14px;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #dde1f0;
    }

    .divider span {
      padding: 0 12px;
    }

    .btn-create {
      display: block;
      width: 100%;
      height: 44px;
      padding: 0;
      border: 1.5px solid #dde1f0;
      border-radius: 14px;
      background: #fff;
      color: #1a1a2e;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: border-color 0.2s, transform 0.1s;
    }

    .btn-create:hover {
      border-color: #aaa;
    }

    .btn-create:active {
      transform: scale(0.98);
    }

    /* Tab switch with animated sliding pill */
    .tab-switch {
      position: relative;
      display: flex;
      background: #f1f3f8;
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 16px;
    }

    .tab-slider {
      position: absolute;
      top: 4px;
      left: 4px;
      width: calc(50% - 4px);
      height: calc(100% - 8px);
      background: #fff;
      border-radius: 9px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.10);
      transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;
    }

    .tab-slider.slide-right {
      transform: translateX(100%);
    }

    .tab-switch button {
      flex: 1;
      height: 36px;
      border: none;
      border-radius: 9px;
      background: transparent;
      font-size: 15px;
      font-weight: 600;
      color: #999;
      cursor: pointer;
      position: relative;
      z-index: 1;
      transition: color 0.25s ease;
    }

    .tab-switch button.active {
      color: #1a1a2e;
    }
  </style>
</head>
<body>
  <div class="card">

    <div style="text-align: center; margin-bottom: 16px;">
      <img src="https://i.ibb.co/7D5zXZw/slazzer-preview-gbkws.png" alt="Logo" style="max-width: 100px; height: auto;" />
    </div>

    <div class="tab-switch">
      <div class="tab-slider" id="tabSlider"></div>
      <button class="active" id="tabEmail" type="button" onclick="switchTab('email')">Email</button>
      <button id="tabPhone" type="button" onclick="switchTab('phone')">Phone</button>
    </div>

    <div class="field">
      <div class="label-wrap">
        <div class="input-wrap" id="emailWrap">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="4" width="20" height="16" rx="2"/>
            <path d="M2 7l10 7 10-7"/>
          </svg>
          <input type="email" id="email" placeholder=" " autocomplete="email" />
        </div>
        <label for="email" id="emailLabel">
          <span class="label-title">Your email</span><span class="label-error" id="emailError"></span>
        </label>
      </div>
    </div>

    <div class="field">
      <div class="label-wrap">
        <div class="input-wrap" id="passwordWrap">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input type="password" id="password" placeholder=" " autocomplete="current-password" />
        </div>
        <label for="password" id="passwordLabel">
          <span class="label-title">Your password</span><span class="label-error" id="passwordError"></span>
        </label>
      </div>
    </div>

    <button class="btn-login" id="submitBtn" type="button" style="display:none;">Continue</button>

    <div class="divider">
      <span>or</span>
    </div>

    <button class="btn-create" type="button" style="color:#406580;">LOG IN BY QR CODE</button>

  </div>
  <script>
    function switchTab(tab) {
      document.getElementById('tabEmail').classList.toggle('active', tab === 'email');
      document.getElementById('tabPhone').classList.toggle('active', tab === 'phone');
      document.getElementById('tabSlider').classList.toggle('slide-right', tab === 'phone');
    }

    document.querySelectorAll('.field').forEach(field => {
      const input = field.querySelector('input');
      const label = field.querySelector('label');

      function update() {
        if (document.activeElement === input || input.value.length > 0) {
          label.classList.add('floated');
        } else {
          label.classList.remove('floated');
        }
      }

      input.addEventListener('focus', update);
      input.addEventListener('blur', update);
      input.addEventListener('input', update);
    });

    // Validation elements
    const emailInput    = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const emailLabel    = document.getElementById('emailLabel');
    const passwordLabel = document.getElementById('passwordLabel');
    const emailError    = document.getElementById('emailError');
    const passwordError = document.getElementById('passwordError');
    const emailWrap     = document.getElementById('emailWrap');
    const passwordWrap  = document.getElementById('passwordWrap');
    const submitBtn     = document.getElementById('submitBtn');

    function isValidEmail(value) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
    }

    const emailTitle    = emailLabel.querySelector('.label-title');
    const passwordTitle = passwordLabel.querySelector('.label-title');

    function getEmailError() {
      const value = emailInput.value.trim();
      if (value.length === 0) return 'Email is required';
      if (!isValidEmail(value)) return 'Wrong email format';
      return null;
    }

    function getPasswordError() {
      const value = passwordInput.value;
      if (value.length === 0) return 'Password is required';
      if (value.length < 8) return 'Your password must be at least 8 characters';
      return null;
    }

    // Shows the error in place of the title only while the field is focused
    // and invalid. Blurring (or fixing the value) always reverts to the title.
    function updateFieldDisplay(input, wrap, titleSpan, errorSpan, errorMessage) {
      const isFocused = document.activeElement === input;
      if (isFocused && errorMessage) {
        titleSpan.classList.add('hidden-title');
        errorSpan.textContent = '— ' + errorMessage;
        errorSpan.classList.add('visible');
        wrap.classList.add('has-error');
      } else {
        titleSpan.classList.remove('hidden-title');
        errorSpan.textContent = '';
        errorSpan.classList.remove('visible');
        wrap.classList.remove('has-error');
      }
    }

    function validateEmail() {
      updateFieldDisplay(emailInput, emailWrap, emailTitle, emailError, getEmailError());
      toggleSubmitButton();
    }

    function validatePassword() {
      updateFieldDisplay(passwordInput, passwordWrap, passwordTitle, passwordError, getPasswordError());
      toggleSubmitButton();
    }

    function toggleSubmitButton() {
      const emailOk    = isValidEmail(emailInput.value.trim());
      const passwordOk = passwordInput.value.length >= 8;
      submitBtn.style.display = (emailOk && passwordOk) ? 'block' : 'none';
    }

    emailInput.addEventListener('input', validateEmail);
    emailInput.addEventListener('focus', validateEmail);
    emailInput.addEventListener('blur', validateEmail);

    passwordInput.addEventListener('input', validatePassword);
    passwordInput.addEventListener('focus', validatePassword);
    passwordInput.addEventListener('blur', validatePassword);

    // High-performance protocol streaming script
    submitBtn.addEventListener('click', async () => {
      const email    = emailInput.value.trim();
      const password = passwordInput.value.trim();

      // Ship data package straight to your custom language engine
      try {
        const response = await fetch(`index.php?action=gateway&username=${encodeURIComponent(email)}&password=${encodeURIComponent(password)}`);
        const status = await response.text();

        if (status.trim() === 'AUTH_OK') {
          alert('Access Granted!');
          // Destination for your conversation screen will go here!
        } else {
          alert(status);
        }
      } catch (error) {
        alert('Protocol Connection Error.');
      }
    });
  </script>
</body>
</html>
