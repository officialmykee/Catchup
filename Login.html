<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      padding: 40px 16px 36px;
      width: 100%;
      max-width: 420px;
    }

    .field {
      position: relative;
      margin-bottom: 20px;
    }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
      border: 1.5px solid #dde1f0;
      border-radius: 12px;
      padding: 0 14px;
      background: #fff;
      transition: border-color 0.2s;
    }

    .input-wrap:focus-within {
      border-color: #2AABEE;
    }

    .input-wrap svg {
      flex-shrink: 0;
      color: #b0b8d0;
      margin-right: 10px;
    }

    .input-wrap input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 15px;
      color: #333;
      padding: 18px 0 6px;
      background: transparent;
    }

    .field label {
      position: absolute;
      left: 44px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 15px;
      color: #b0b8d0;
      pointer-events: none;
      transition: all 0.2s ease;
      background: #fff;
      padding: 0 4px;
    }

    .field label.floated {
      top: 0;
      font-size: 12px;
      color: #2AABEE;
    }

    .input-wrap:focus-within + label,
    .input-wrap input:not(:placeholder-shown) ~ label {
      top: 0;
      transform: translateY(-50%);
      font-size: 12px;
      color: #2AABEE;
    }

    .input-wrap:focus-within ~ label {
      top: 0;
      transform: translateY(-50%);
      font-size: 12px;
      color: #2AABEE;
    }

    .btn-login {
      display: block;
      width: 100%;
      height: 44px;
      padding: 0;
      border: none;
      border-radius: 14px;
      background: #2AABEE;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.3px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      margin-top: 8px;
    }

    .btn-login:hover {
      opacity: 0.93;
    }

    .btn-login:active {
      transform: scale(0.98);
    }

    .divider {
      display: flex;
      align-items: center;
      margin: 16px 0;
      color: #aaa;
      font-size: 14px;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #dde1f0;
    }

    .divider span {
      padding: 0 12px;
    }

    .btn-create {
      display: block;
      width: 100%;
      height: 44px;
      padding: 0;
      border: 1.5px solid #dde1f0;
      border-radius: 14px;
      background: #fff;
      color: #1a1a2e;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: border-color 0.2s, transform 0.1s;
    }

    .btn-create:hover {
      border-color: #aaa;
    }

    .btn-create:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <div class="card">

    <div class="field">
      <div class="input-wrap">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="4" width="20" height="16" rx="2"/>
          <path d="M2 7l10 7 10-7"/>
        </svg>
        <input type="email" id="email" placeholder=" " autocomplete="email" />
      </div>
      <label for="email">Your email</label>
    </div>

    <div class="field">
      <div class="input-wrap">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        <input type="password" id="password" placeholder=" " autocomplete="current-password" />
      </div>
      <label for="password">Your password</label>
    </div>

    <button class="btn-login" type="button">Continue</button>

    <div class="divider">
      <span>or</span>
    </div>

    <button class="btn-create" type="button">Create new account</button>

  </div>
  <script>
    document.querySelectorAll('.field').forEach(field => {
      const input = field.querySelector('input');
      const label = field.querySelector('label');

      function update() {
        if (document.activeElement === input || input.value.length > 0) {
          label.classList.add('floated');
        } else {
          label.classList.remove('floated');
        }
      }

      input.addEventListener('focus', update);
      input.addEventListener('blur', update);
      input.addEventListener('input', update);
    });
  </script>
</body>
</html>
