<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catchup Header UI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #ffffff;
      min-height: 100vh;
    }

    /* ── Header wrapper — shadow only here ── */
    .header {
      background: #ffffff;
      position: relative;
      z-index: 10;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
    }

    /* ── Top Bar ── */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px 12px;
      width: 100%;
    }

    .app-name {
      font-size: 22px;
      font-weight: 700;
      color: #2AABEE;
      letter-spacing: -0.3px;
    }

    .search-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #2AABEE;
      border-radius: 50%;
      transition: background 0.15s;
    }

    .search-btn:hover { background: rgba(42, 171, 238, 0.08); }
    .search-btn svg { width: 22px; height: 22px; }

    /* ── Tab Bar ── */
    .tab-bar {
      display: flex;
      align-items: center;
      width: 100%;
    }

    .tab {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 0 12px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: #555e6e;
      cursor: pointer;
      position: relative;
      transition: color 0.2s;
      user-select: none;
    }

    .tab:hover { color: #2AABEE; }
    .tab.active { color: #2AABEE; }

    .tab.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 16px;
      right: 16px;
      height: 2.5px;
      background: #2AABEE;
      border-radius: 2px 2px 0 0;
    }

    .tab-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      border-radius: 10px;
      font-size: 10px;
      font-weight: 700;
      line-height: 1;
    }

    .tab.active .tab-badge { background: #2AABEE; color: #fff; }
    .tab:not(.active) .tab-badge { background: #d0d4db; color: #fff; }

    /* ── Chat List ── */
    .chat-item {
      display: flex;
      align-items: center;
      padding: 10px 16px;
      background: #fff;
      border-bottom: 1px solid #efefef;
      gap: 12px;
    }

    .avatar {
      width: 57px;
      height: 55px;
      border-radius: 25px;
      object-fit: cover;
      flex-shrink: 0;
      background: #ccc;
    }

    .chat-info {
      flex: 1;
      min-width: 0;
    }

    .chat-name {
      font-size: 15px;
      font-weight: 700;
      color: #111;
      margin-bottom: 3px;
    }

    .chat-preview {
      font-size: 14px;
      color: #999;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chat-meta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
      flex-shrink: 0;
    }

    .chat-time { font-size: 14px; color: #999; }

    .unread-badge {
      background: #22c55e;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>

  <div class="header">
    <!-- Top bar -->
    <div class="top-bar">
      <span class="app-name">Catchup</span>
      <button class="search-btn" aria-label="Search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      </button>
    </div>

    <!-- Tab bar -->
    <div class="tab-bar">
      <div class="tab">Calls <span class="tab-badge">34</span></div>
      <div class="tab active">Chats <span class="tab-badge">55</span></div>
      <div class="tab">Contacts</div>
    </div>
  </div>

  <!-- Single chat item -->
  <div class="chat-item">
    <img class="avatar" src="https://i.pravatar.cc/150?img=68" alt="Daniel" />
    <div class="chat-info">
      <div class="chat-name">Daniel</div>
      <div class="chat-preview">Ok</div>
    </div>
    <div class="chat-meta">
      <span class="chat-time">Sat</span>
      <span class="unread-badge">1</span>
    </div>
  </div>

</body>
</html>
