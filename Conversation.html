<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Header</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    .header {
      background-color: #794d9a;
      width: 100%;
      /* Respect the device safe area (notch/status bar) */
      padding-top: env(safe-area-inset-top, 0px);
      padding-left: env(safe-area-inset-left, 0px);
      padding-right: env(safe-area-inset-right, 0px);
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 3px 16px;
      min-height: 0;
    }

    /* Left placeholder (icon area) */
    .header-left {
      width: 36px;
      height: 36px;
    }

    /* Center toggle pill */
    .toggle-pill {
      display: flex;
      align-items: center;
      background-color: rgba(0, 0, 0, 0.25);
      border-radius: 10px;
      padding: 3px;
      gap: 2px;
    }

    .toggle-pill button {
      border: none;
      background: transparent;
      color: rgba(255, 255, 255, 0.65);
      font-size: 15px;
      font-weight: 500;
      padding: 7px 0;
      width: 105px;
      border-radius: 7px;
      cursor: pointer;
      transition: background 0.18s ease, color 0.18s ease;
      letter-spacing: 0.01em;
      line-height: 1;
    }

    .toggle-pill button.active {
      background-color: #7e599c;
      color: #ffffff;
      font-weight: 600;
    }

    .toggle-pill button:focus-visible {
      outline: 2px solid rgba(255,255,255,0.6);
      outline-offset: 2px;
    }

    /* Right placeholder (icon area) */
    .header-right {
      width: 36px;
      height: 36px;
    }

    /* Chat list item */
    .chat-item {
      display: flex;
      align-items: center;
      padding: 10px 16px;
      background: #fff;
      border-bottom: 1px solid #efefef;
      gap: 12px;
    }

    .avatar {
      width: 57px;
      height: 55px;
      border-radius: 25px;
      object-fit: cover;
      flex-shrink: 0;
      background: #ccc;
    }

    .chat-info {
      flex: 1;
      min-width: 0;
    }

    .chat-name {
      font-size: 15px;
      font-weight: 700;
      color: #111;
      margin-bottom: 3px;
    }

    .chat-preview {
      font-size: 14px;
      color: #999;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chat-meta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
      flex-shrink: 0;
    }

    .chat-time {
      font-size: 12px;
      color: #999;
    }

    .badge {
      background: #22c55e;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="header-inner">
      <div class="header-left"></div>

      <div class="toggle-pill" role="tablist" aria-label="View toggle">
        <button class="active" role="tab" aria-selected="true">All</button>
        <button role="tab" aria-selected="false">Groups</button>
      </div>

      <div class="header-right"></div>
    </div>
  </header>

  <div class="chat-item">
    <img class="avatar" src="https://i.pravatar.cc/52?img=8" alt="Daniel" />
    <div class="chat-info">
      <div class="chat-name">Daniel</div>
      <div class="chat-preview">Ok</div>
    </div>
    <div class="chat-meta">
      <span class="chat-time">Sat</span>
      <span class="badge">1</span>
    </div>
  </div>

  <script>
    const buttons = document.querySelectorAll('.toggle-pill button');
    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        buttons.forEach(b => {
          b.classList.remove('active');
          b.setAttribute('aria-selected', 'false');
        });
        btn.classList.add('active');
        btn.setAttribute('aria-selected', 'true');
      });
    });
  </script>

</body>
</html>
