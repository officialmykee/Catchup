<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DeepSeek Search UI</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      height: 100vh;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .chat-bar-wrapper {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      width: 100%;
      padding: 12px 16px 20px 16px;
      background: #ffffff;
      z-index: 5;
    }

    /* AI response */
    .ai-response {
      width: 100%;
      margin-top: 20px;
    }

    .ai-label {
      font-size: 13px;
      color: #aaa;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: opacity 0.4s;
    }

    .ai-label .state-icon {
      font-size: 15px;
      display: inline-block;
    }

    .ai-label .dot-wave {
      display: inline-flex;
      gap: 3px;
      align-items: center;
    }

    .ai-label .dot-wave span {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #aaa;
      display: inline-block;
      animation: none;
      opacity: 0.3;
    }

    @keyframes dotBounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.3; }
      40% { transform: translateY(-4px); opacity: 1; }
    }

    .ai-label.active .dot-wave span:nth-child(1) { animation: dotBounce 1s ease-in-out infinite 0s; }
    .ai-label.active .dot-wave span:nth-child(2) { animation: dotBounce 1s ease-in-out infinite 0.2s; }
    .ai-label.active .dot-wave span:nth-child(3) { animation: dotBounce 1s ease-in-out infinite 0.4s; }

    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .ai-text.visible {
      animation: fadeSlideIn 0.5s ease forwards;
    }

    .ai-actions.visible {
      animation: fadeSlideIn 0.4s ease 0.2s forwards;
      opacity: 0;
    }

    @keyframes popIn {
      0% { transform: scale(0.8); opacity: 0; }
      70% { transform: scale(1.1); }
      100% { transform: scale(1); opacity: 1; }
    }

    .ai-text {
      font-size: 15px;
      color: #222;
      line-height: 1.6;
    }

    .ai-actions {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 10px;
    }

    .ai-actions button {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.15s;
    }
    .ai-actions button:hover { opacity: 0.6; }

    /* Message area */
    .message-area {
      flex: 1;
      padding: 70px 16px 160px 16px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      overflow-y: auto;
    }

    .message-bubble {
      background: #ffffff;
      color: #111;
      border-radius: 18px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.10);
      padding: 10px 16px;
      font-size: 15px;
      white-space: nowrap;
      display: inline-block;
      line-height: 1.5;
    }

    .message-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 6px;
      padding-right: 4px;
    }

    .message-actions button {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      color: #999;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s;
    }
    .message-actions button:hover { color: #555; }

    /* Header */
    .header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 56px;
      background: #ffffff;
      display: flex;
      align-items: center;
      padding: 0 16px;
      z-index: 10;
    }

    .btn-hamburger {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: transparent;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-hamburger:hover { background: #e5e5e5; }

    /* Input pill */
    .input-pill {
      background: #ffffff;
      border-radius: 28px;
      padding: 14px 18px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.10);
    }

    .input-pill [contenteditable] {
      flex: 1;
      border: none;
      background: transparent;
      font-size: 15.5px;
      color: #111;
      outline: none;
      caret-color: #4a8cff;
      word-break: break-word;
      white-space: pre-wrap;
      max-height: 140px;
      overflow-y: auto;
      line-height: 1.5;
    }

    .input-pill [contenteditable]:empty::before {
      content: attr(data-placeholder);
      color: #a0a0a0;
      pointer-events: none;
      display: block;
    }

    /* Toolbar row */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .chip {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #ffffff;
      border: none;
      border-radius: 20px;
      padding: 7px 14px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.10);
      font-size: 13.5px;
      font-weight: 500;
      color: #222;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .chip:hover { background: #f5f5f5; }
    .chip:active { background: #ebebeb; }

    .chip svg {
      flex-shrink: 0;
    }

    /* Spacer pushes send to the right */
    .spacer { flex: 1; }

    /* Plus button */
    .btn-plus {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: transparent;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #555;
      transition: background 0.15s;
    }
    .btn-plus:hover { background: #e5e5e5; }

    /* Send button */
    .btn-send {
      width: 48px;
      height: 38px;
      border-radius: 19px;
      background: #4a8cff;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(74,140,255,0.35);
      transition: background 0.15s, box-shadow 0.15s;
    }
    .btn-send:hover {
      background: #3a7af0;
      box-shadow: 0 3px 12px rgba(74,140,255,0.45);
    }
    .btn-send:active { background: #2b6bdf; }

    /* Edit overlay on bubble */
    .bubble-edit-container { display: none; width: 100%; }
    .bubble-edit-box {
      width: 100%;
      border: 2px solid #4a8cff;
      border-radius: 16px;
      padding: 12px 16px;
      font-size: 15px;
      color: #111;
      outline: none;
      font-family: inherit;
      line-height: 1.5;
      resize: none;
      background: #fff;
      box-shadow: 0 1px 6px rgba(0,0,0,0.10);
    }
    .bubble-edit-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 8px;
    }
    .btn-cancel {
      background: #f0f0f0;
      border: none;
      border-radius: 20px;
      padding: 7px 18px;
      font-size: 14px;
      cursor: pointer;
      color: #333;
    }
    .btn-cancel:hover { background: #e5e5e5; }
    .btn-save {
      background: #4a8cff;
      border: none;
      border-radius: 20px;
      padding: 7px 18px;
      font-size: 14px;
      cursor: pointer;
      color: #fff;
      font-weight: 500;
    }
    .btn-save:hover { background: #3a7af0; }

    /* Dimmed retry */
    .btn-retry-disabled {
      opacity: 0.35;
      cursor: not-allowed !important;
      pointer-events: none;
    }
  </style>
</head>

  <script>
    // Playful thinking animation
    const label = document.getElementById('ai-label');
    const aiText = document.getElementById('ai-text');
    const aiActions = document.querySelector('.ai-actions');

    const states = [
      { icon: '📖', text: 'Cleainput is Reading' },
      { icon: '💡', text: 'Cleainput is Understanding' },
    ];

    function setLabel(icon, text, withDots) {
      withDots = withDots !== false;
      var dots = withDots ? '<span class="dot-wave"><span></span><span></span><span></span></span>' : '';
      var iconHtml = icon ? '<span class="state-icon">' + icon + '</span>' : '';
      label.innerHTML = iconHtml + '<span>' + text + '</span>' + dots;
      label.className = 'ai-label' + (withDots ? ' active' : '');
    }

    function showExecuted() {
      label.innerHTML = 'Executed';
      label.className = 'ai-label';
      setTimeout(() => {
        aiText.style.display = '';
        aiText.classList.add('visible');
        aiActions.style.display = '';
        setTimeout(() => aiActions.classList.add('visible'), 100);
      }, 300);
    }

    aiText.style.display = 'none';
    aiActions.style.display = 'none';

    setLabel('', states[0].text);
    setTimeout(() => {
      setLabel('', states[1].text);
      setTimeout(() => {
        showExecuted();
      }, 1400);
    }, 1400);

    // === Bubble Edit ===
    var bubble = document.getElementById('user-bubble');
    var editBtn = document.getElementById('bubble-edit-btn');
    var editContainer = document.getElementById('bubble-edit-container');
    var editTextarea = document.getElementById('bubble-edit-textarea');
    var cancelBtn = document.getElementById('bubble-cancel-btn');
    var saveBtn = document.getElementById('bubble-save-btn');

    editBtn.addEventListener('click', function() {
      editTextarea.value = bubble.textContent;
      bubble.style.display = 'none';
      document.querySelector('.message-actions').style.display = 'none';
      editContainer.style.display = 'block';
      editTextarea.focus();
    });

    cancelBtn.addEventListener('click', function() {
      editContainer.style.display = 'none';
      bubble.style.display = '';
      document.querySelector('.message-actions').style.display = '';
    });

    saveBtn.addEventListener('click', function() {
      var newText = editTextarea.value.trim();
      if (newText) bubble.textContent = newText;
      editContainer.style.display = 'none';
      bubble.style.display = '';
      document.querySelector('.message-actions').style.display = '';
    });

    // === Copy bubble text ===
    document.getElementById('bubble-copy-btn').addEventListener('click', function() {
      navigator.clipboard.writeText(bubble.textContent).catch(function(){});
      this.style.opacity = '0.4';
      var btn = this;
      setTimeout(function(){ btn.style.opacity = ''; }, 800);
    });

    // === Copy AI text ===
    document.getElementById('ai-copy-btn').addEventListener('click', function() {
      var txt = document.getElementById('ai-text').textContent;
      navigator.clipboard.writeText(txt).catch(function(){});
      this.style.opacity = '0.4';
      var btn = this;
      setTimeout(function(){ btn.style.opacity = ''; }, 800);
    });

    // === Like / Dislike toggle ===
    document.getElementById('like-btn').addEventListener('click', function() {
      var active = this.dataset.active === '1';
      this.dataset.active = active ? '0' : '1';
      this.querySelector('path').setAttribute('fill', active ? '#aaa' : '#4a8cff');
      document.getElementById('dislike-btn').dataset.active = '0';
      document.getElementById('dislike-btn').querySelector('path').setAttribute('fill', '#aaa');
    });

    document.getElementById('dislike-btn').addEventListener('click', function() {
      var active = this.dataset.active === '1';
      this.dataset.active = active ? '0' : '1';
      this.querySelector('path').setAttribute('fill', active ? '#aaa' : '#ff4a4a');
      document.getElementById('like-btn').dataset.active = '0';
      document.getElementById('like-btn').querySelector('path').setAttribute('fill', '#aaa');
    });

    // === Editor ===
    const editor = document.querySelector('[contenteditable]');
    editor.addEventListener('input', () => {
      if (editor.innerHTML === '<br>' || editor.innerHTML === '') {
        editor.innerHTML = '';
      }
    });
    editor.addEventListener('blur', () => {
      if (editor.innerHTML === '<br>' || editor.innerText.trim() === '') {
        editor.innerHTML = '';
      }
    });
  </script>
</body>
</html>
