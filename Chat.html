<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    height: 100vh;
  }

  .chat-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: #000;
  }

  .divider {
    height: 1px;
    background: #2a2a2a;
    width: 100%;
  }

  .input-row {
    padding: 10px 64px 10px 16px;
  }

  .input-row [contenteditable] {
    background: transparent;
    border: none;
    outline: none;
    color: #777;
    font-size: 16px;
    width: 100%;
    min-height: 22px;
    caret-color: #fff;
  }

  .input-row [contenteditable]:empty::before {
    content: "Type a message...";
    color: #555;
    pointer-events: none;
    display: block;
  }

  .toolbar {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 6px 64px 12px 16px;
  }

  .icon-dot {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: #2a2a2a;
  }

  .mic-btn {
    position: fixed;
    bottom: 12px;
    right: 10px;
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: linear-gradient(145deg, #7b4fc4, #a76de0);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .mic-btn svg {
    width: 22px;
    height: 22px;
    fill: #fff;
  }
</style>
</head>
<body>

  <div class="chat-bar">
    <div class="divider"></div>
    <div class="input-row">
      <div id="msgBox" contenteditable="true" role="textbox"></div>
    </div>
    <div class="toolbar">
      <div class="icon-dot"></div>
      <div class="icon-dot"></div>
      <div class="icon-dot"></div>
      <div class="icon-dot"></div>
      <div class="icon-dot"></div>
      <div class="icon-dot"></div>
    </div>
  </div>

  <button class="mic-btn">
    <svg viewBox="0 0 24 24">
      <path d="M12 1a4 4 0 0 1 4 4v6a4 4 0 0 1-8 0V5a4 4 0 0 1 4-4zm6.5 9a1 1 0 0 1 1 1 7.5 7.5 0 0 1-15 0 1 1 0 1 1 2 0 5.5 5.5 0 0 0 11 0 1 1 0 0 1 1-1zM12 19a1 1 0 0 1 1 1v2a1 1 0 1 1-2 0v-2a1 1 0 0 1 1-1z"/>
    </svg>
  </button>

  <script>
    const box = document.getElementById('msgBox');

    box.addEventListener('input', () => {
      // If only a <br> or whitespace remains, clear it so :empty CSS triggers
      if (box.innerHTML === '<br>' || box.innerHTML.trim() === '') {
        box.innerHTML = '';
      }
    });
  </script>

</body>
</html>
