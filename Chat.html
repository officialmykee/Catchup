<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #fff;
    height: 100vh;
  }

  .chat-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: #fff;
  }

  .divider {
    height: 1px;
    background: #ddd;
    width: 100%;
  }

  .input-row {
    padding: 10px 64px 10px 16px;
  }

  .input-row [contenteditable] {
    background: transparent;
    border: none;
    outline: none;
    color: #000;
    font-size: 16px;
    width: 100%;
    min-height: 22px;
    caret-color: #000;
  }

  .input-row [contenteditable]:empty::before {
    content: "Type a message...";
    color: #aaa;
    pointer-events: none;
    display: block;
  }

  .toolbar {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 6px 64px 12px 16px;
  }

  .icon-dot {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: #ddd;
    flex-shrink: 0;
  }

  .smile-icon {
    width: 28px;
    height: 28px;
    flex-shrink: 0;
    display: block;
  }

  .mic-btn {
    position: fixed;
    bottom: 12px;
    right: 10px;
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: linear-gradient(145deg, #7b4fc4, #a76de0);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .mic-btn svg {
    width: 22px;
    height: 22px;
    fill: #fff;
  }
</style>
</head>

    </svg>
  </button>

  <script>
    const box = document.getElementById('msgBox');
    box.addEventListener('input', () => {
      if (box.innerHTML === '<br>' || box.innerHTML.trim() === '') {
        box.innerHTML = '';
      }
    });
  </script>

</body>
</html>
