<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat Input</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      height: 100vh;
      height: 100dvh;
      background: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
    }

    .chat-area { flex: 1; }

    .input-bar {
      width: 100%;
      padding: 8px 4px calc(8px + env(safe-area-inset-bottom)) 16px;
      background: #ffffff;
      border-top: 1px solid #e5e5e5;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .input-wrapper {
      flex: 1;
      position: relative;
      background: #ebebeb;
      border-radius: 18px;
    }

    .input-pill {
      display: block;
      width: calc(100% - 40px);
      background: transparent;
      border-radius: 18px;
      min-height: 30px;
      max-height: 160px;
      overflow-y: auto;
      padding: 9px 18px;
      font-size: 16px;
      color: #1c1c1e;
      line-height: 1.4;
      outline: none;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .input-pill:empty::before {
      content: attr(data-placeholder);
      color: #8e8e93;
      pointer-events: none;
    }

    .input-pill::-webkit-scrollbar { width: 4px; }
    .input-pill::-webkit-scrollbar-thumb {
      background: #c7c7cc;
      border-radius: 2px;
    }

    .emoji-btn {
      position: absolute;
      right: 4px;
      top: 50%;
      transform: translateY(-50%);
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      opacity: 0.85;
    }

    .emoji-btn:hover { opacity: 1; }

    .emoji-btn svg {
      width: 22px;
      height: 22px;
    }

    .send-btn {
      flex-shrink: 0;
      width: 41px;
      height: 41px;
      border-radius: 50%;
      background: #007AFF;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .send-btn svg {
      width: 27px;
      height: 27px;
    }

    .send-btn:hover { background: #0066d6; }
  </style>
</head>
<body>

  <div class="chat-area"></div>

  <div class="input-bar">
    <div class="input-wrapper">
      <div
        class="input-pill"
        contenteditable="true"
        role="textbox"
        aria-multiline="true"
        aria-label="Message"
        data-placeholder="Message"
      ></div>
      <button class="emoji-btn" type="button" title="Emoji" aria-label="Insert emoji">
        <svg width="200" height="200" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="#5a5a5a" d="M12 0a12 12 0 1 0 12 12A12 12 0 0 0 12 0M7.5 7a2 2 0 1 1-2 2a2 2 0 0 1 2-2m-.44 8.71a.43.43 0 0 1 .38-.22h9.12a.43.43 0 0 1 .38.22a.43.43 0 0 1 0 .44a5.71 5.71 0 0 1-9.88 0a.43.43 0 0 1 0-.44M16.5 11a2 2 0 1 1 2-2a2 2 0 0 1-2 2"/></svg>
      </button>
    </div>
    <button class="send-btn" type="button" aria-label="Send">
      <svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 256 256"><path fill="#ffffff" d="M80 128V64a48 48 0 0 1 96 0v64a48 48 0 0 1-96 0Zm128 0a8 8 0 0 0-16 0a64 64 0 0 1-128 0a8 8 0 0 0-16 0a80.11 80.11 0 0 0 72 79.6V232a8 8 0 0 0 16 0v-24.4a80.11 80.11 0 0 0 72-79.6Z"/></svg>
    </button>
  </div>

</body>
</html>
