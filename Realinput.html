<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat Input</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      height: 100vh;
      background: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
    }

    .chat-area { flex: 1; }

    .input-bar {
      width: 100%;
      padding: 8px 16px;
      background: #ffffff;
      border-top: 1px solid #e5e5e5;
    }

    .input-wrapper {
      position: relative;
      background: #ebebeb;
      border-radius: 18px;
    }

    .input-pill {
      display: block;
      width: 100%;
      background: transparent;
      border-radius: 18px;
      min-height: 36px;
      max-height: 160px;
      overflow-y: auto;
      /* right padding keeps text from going under icon */
      padding: 9px 86px 9px 18px;
      font-size: 16px;
      color: #1c1c1e;
      line-height: 1.4;
      outline: none;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .input-pill:empty::before {
      content: attr(data-placeholder);
      color: #8e8e93;
      pointer-events: none;
    }

    .input-pill::-webkit-scrollbar { width: 4px; }
    .input-pill::-webkit-scrollbar-thumb {
      background: #c7c7cc;
      border-radius: 2px;
    }

    .emoji-btn {
      position: absolute;
      /* flush to the right inner edge of the pill */
      right: 0px;
      top: 50%;
      transform: translateY(-50%);
      width: 77px;
      height: 77px;
      cursor: pointer;
      opacity: 0.75;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .emoji-btn svg {
      width: 77px;
      height: 77px;
    }

    .emoji-btn:hover { opacity: 1; }
  </style>
</head>
<body>

  <div class="chat-area"></div>

  <div class="input-bar">
    <div class="input-wrapper">
      <div
        class="input-pill"
        contenteditable="true"
        role="textbox"
        aria-multiline="true"
        aria-label="Message"
        data-placeholder="Message #..."
      ></div>

</body>
</html>
